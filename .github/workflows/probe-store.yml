name: Probe store format
on:
  workflow_dispatch:
  pull_request:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Every setting
        run: |
          nix config show 2>&1 | grep -vE '^\s*#' | grep -vE '^\s*$'
      - name: Format of a substituted path
        run: |
          set -e
          p=$(nix build --no-link --print-out-paths nixpkgs#hello)
          echo "path: $p"
          ls -ld "$p"
          file "$p" || true
          stat -c 'size=%s' "$p"
          head -c 16 "$p" | xxd | head -2
      - name: Format of a copied path
        run: |
          set -e
          rm -rf /tmp/store-b
          mkdir -p /tmp/store-b
          mkdir -p /tmp/src
          dd if=/dev/urandom of=/tmp/src/big.bin bs=1M count=200 status=none
          p=$(nix store add-path /tmp/src)
          echo "path: $p"
          ls -ld "$p"; file "$p" || true
          echo "== copying into a second store"
          time nix --store /tmp/store-b copy --from /nix/store "$p" 2>&1 | tail -3
          q=$(ls -d /tmp/store-b/nix/store/* | head -1)
          echo "copied: $q"
          ls -ld "$q"; file "$q" || true
          stat -c 'size=%s' "$q"
          head -c 16 "$q" | xxd | head -2
      - name: Does a copied store stay valid
        run: |
          set -e
          rm -rf /tmp/store-a /tmp/store-c
          echo hello > /tmp/probe.txt
          full=$(nix --store /tmp/store-a store add-file /tmp/probe.txt --name probe-copy)
          echo "full: $full"
          mkdir -p /tmp/store-c/nix/var/nix/db
          cp -a /tmp/store-a/nix/store /tmp/store-c/nix/store
          cp -a /tmp/store-a/nix/var/nix/db/. /tmp/store-c/nix/var/nix/db/
          echo "== path-info of the copied store"
          nix --store /tmp/store-c path-info --json "$full"
          echo "== content of the copied path"
          nix --store /tmp/store-c store cat "$full"
