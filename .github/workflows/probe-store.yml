name: Probe store format
on:
  workflow_dispatch:
  pull_request:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Reproduce the plan of the guest installation
        run: |
          set -e
          rm -rf /tmp/target
          mkdir -p /tmp/target
          cp -R ./. /tmp/target/etc-nixos/
          rm -rf /tmp/target/etc-nixos/.git
          cat > /tmp/target/etc-nixos/host.nix <<'HOST'
          { ... }: {
            networking.hostName = "ravnix-test";
            time.timeZone = "Europe/Warsaw";
            users.users."tester" = {
              isNormalUser = true;
              extraGroups = [ "wheel" "networkmanager" "video" "render" "input" "lp" "scanner" "dialout" ];
            };
            boot.loader.grub = {
              enable = true;
              device = "/dev/sda";
              efiSupport = false;
              efiInstallAsRemovable = false;
            };
            boot.loader.efi = { canTouchEfiVariables = false; efiSysMountPoint = "/boot/efi"; };
          }
          HOST
          cat > /tmp/target/etc-nixos/hardware-configuration.nix <<'HW'
          { ... }: {
            boot.initrd.availableKernelModules = [ "ahci" "ata_base" "ata_generic" "ata_piix" "libata" "sd_mod" "sr_mod" ];
            boot.initrd.kernelModules = [ ];
            boot.supportedFilesystems = [ "ext4" "vfat" ];
            fileSystems."/" = {
              device = "/dev/disk/by-label/RAVNIX_ROOT";
              fsType = "ext4";
            };
          }
          HW
          cat > /tmp/target/etc-nixos/configuration.nix <<'CFG'
          { ... }: { imports = [ ./modules/base.nix ./hardware-configuration.nix ./host.nix ]; }
          CFG
          echo "===== the plan of the installation ====="
          nix build "path:/tmp/target/etc-nixos#ravnix" --dry-run 2>&1 | tail -120
      - name: What the live image already carries
        run: |
          set -e
          nix path-info -r .#nixosConfigurations.live.config.system.build.toplevel 2>/dev/null | sort > /tmp/live-closure.txt
          echo "live closure paths: $(wc -l < /tmp/live-closure.txt)"
          echo "===== live-only pieces ====="
          nix path-info -r .#nixosConfigurations.live.config.system.build.toplevel 2>/dev/null | sed -E 's#/nix/store/[a-z0-9]{32}-##' | grep -iE 'linux|perl|kernel|grub' | head -20
          echo "===== is the kernel in the live closure? ====="
          nix path-info -r .#nixosConfigurations.live.config.system.build.toplevel 2>/dev/null | grep -E '\-linux-[0-9]' | head -5
          echo "===== is GRUB's perl environment in the live closure? ====="
          nix path-info -r .#nixosConfigurations.live.config.system.build.toplevel 2>/dev/null | grep -iE 'perl' | head -10
