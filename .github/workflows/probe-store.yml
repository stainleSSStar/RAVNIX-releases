name: Probe store format
on:
  workflow_dispatch:
  pull_request:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Reproduce the plan of the guest installation
        run: |
          set -e
          rm -rf /tmp/target
          mkdir -p /tmp/target
          cp -R ./. /tmp/target/etc-nixos/
          rm -rf /tmp/target/etc-nixos/.git
          cat > /tmp/target/etc-nixos/host.nix <<'HOST'
          { ... }: {
            networking.hostName = "ravnix-test";
            time.timeZone = "Europe/Warsaw";
            users.users."tester" = {
              isNormalUser = true;
              extraGroups = [ "wheel" "networkmanager" "video" "render" "input" "lp" "scanner" "dialout" ];
            };
            boot.loader.grub = {
              enable = true;
              device = "/dev/sda";
              efiSupport = false;
              efiInstallAsRemovable = false;
            };
            boot.loader.efi = { canTouchEfiVariables = false; efiSysMountPoint = "/boot/efi"; };
          }
          HOST
          cat > /tmp/target/etc-nixos/hardware-configuration.nix <<'HW'
          { ... }: {
            boot.initrd.availableKernelModules = [ "ahci" "ata_base" "ata_generic" "ata_piix" "libata" "sd_mod" "sr_mod" ];
            boot.initrd.kernelModules = [ ];
            boot.supportedFilesystems = [ "ext4" "vfat" ];
            fileSystems."/" = {
              device = "/dev/disk/by-label/RAVNIX_ROOT";
              fsType = "ext4";
            };
          }
          HW
          cat > /tmp/target/etc-nixos/configuration.nix <<'CFG'
          { ... }: { imports = [ ./modules/base.nix ./hardware-configuration.nix ./host.nix ]; }
          CFG
          target=$(nix eval --raw "path:/tmp/target/etc-nixos#nixosConfigurations.ravnix.config.system.build.toplevel.drvPath")
          live=$(nix eval --raw .#nixosConfigurations.live.config.system.build.toplevel.drvPath)
          echo "target: $target"
          echo "live:   $live"
          for name in target live; do
            nix-store --query --requisites "$(eval echo \$$name)" | while read -r p; do
              nix-store --query --outputs "$p" 2>/dev/null || echo "$p"
            done | sort -u > "/tmp/$name-out.txt"
            echo "$name outputs: $(wc -l < /tmp/$name-out.txt)"
          done
          echo "===== outputs the guest must build that the live image does not carry ====="
          comm -23 /tmp/target-out.txt /tmp/live-out.txt > /tmp/missing.txt
          echo "count: $(wc -l < /tmp/missing.txt)"
          sed -E 's#/nix/store/[a-z0-9]{32}-##' /tmp/missing.txt | head -70
          echo "===== sources those outputs need ====="
          while read -r p; do
            drv=$(nix-store --query --deriver "$p" 2>/dev/null || true)
            [ -n "$drv" ] && nix derivation show "$drv" 2>/dev/null || true
          done < /tmp/missing.txt | jq -r 'select(. != null) | .inputSources // [] | .[]' | sort -u > /tmp/missing-sources.txt
          echo "sources: $(wc -l < /tmp/missing-sources.txt)"
          sed -E 's#/nix/store/[a-z0-9]{32}-##' /tmp/missing-sources.txt | head -20
          echo "===== is the kernel output in the live image? ====="
          grep -E '\-linux-[0-9]' /tmp/live-out.txt | sed -E 's#/nix/store/[a-z0-9]{32}-##' | head -5
          echo "===== perl outputs in the live image ====="
          grep -iE 'perl' /tmp/live-out.txt | sed -E 's#/nix/store/[a-z0-9]{32}-##' | head -12
          echo "===== grub outputs in the live image ====="
          grep -iE 'grub' /tmp/live-out.txt | sed -E 's#/nix/store/[a-z0-9]{32}-##' | head -12
