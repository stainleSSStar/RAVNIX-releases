name: Probe store format
on:
  workflow_dispatch:
  pull_request:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Reproduce the plan of the guest installation
        run: |
          set -e
          rm -rf /tmp/target
          mkdir -p /tmp/target
          cp -R ./. /tmp/target/etc-nixos/
          rm -rf /tmp/target/etc-nixos/.git
          cat > /tmp/target/etc-nixos/host.nix <<'HOST'
          { ... }: {
            networking.hostName = "ravnix-test";
            time.timeZone = "Europe/Warsaw";
            users.users."tester" = {
              isNormalUser = true;
              extraGroups = [ "wheel" "networkmanager" "video" "render" "input" "lp" "scanner" "dialout" ];
            };
            boot.loader.grub = {
              enable = true;
              device = "/dev/sda";
              efiSupport = false;
              efiInstallAsRemovable = false;
            };
            boot.loader.efi = { canTouchEfiVariables = false; efiSysMountPoint = "/boot/efi"; };
          }
          HOST
          cat > /tmp/target/etc-nixos/hardware-configuration.nix <<'HW'
          { ... }: {
            boot.initrd.availableKernelModules = [ "ahci" "ata_base" "ata_generic" "ata_piix" "libata" "sd_mod" "sr_mod" ];
            boot.initrd.kernelModules = [ ];
            boot.supportedFilesystems = [ "ext4" "vfat" ];
            fileSystems."/" = {
              device = "/dev/disk/by-label/RAVNIX_ROOT";
              fsType = "ext4";
            };
          }
          HW
          cat > /tmp/target/etc-nixos/configuration.nix <<'CFG'
          { ... }: { imports = [ ./modules/base.nix ./hardware-configuration.nix ./host.nix ]; }
          CFG
          echo "===== the plan of the installation ====="
          nix build "path:/tmp/target/etc-nixos#nixosConfigurations.ravnix" --dry-run 2>&1 | tee /tmp/plan.txt | tail -60
      - name: What the live image carries
        run: |
          set -e
          live=$(nix eval --raw .#nixosConfigurations.live.config.system.build.toplevel.drvPath)
          echo "live toplevel derivation: $live"
          nix derivation show --recursive "$live" 2>/dev/null | jq -r 'to_entries[].value.outputs | keys[]' | sort -u > /tmp/live-outputs.txt
          echo "live closure outputs: $(wc -l < /tmp/live-outputs.txt)"
          nix derivation show --recursive "$live" 2>/dev/null | jq -r 'keys[]' | sort -u > /tmp/live-drvs.txt
          echo "live closure derivations: $(wc -l < /tmp/live-drvs.txt)"
          echo "===== derivations the installation builds that the live image does not carry ====="
          awk '/derivations will be built/ { collect = 1; next } collect && /^  \/nix\/store\// { print; next } collect { collect = 0 }' /tmp/plan.txt | sort -u > /tmp/target-drvs.txt
          echo "derivations to build: $(wc -l < /tmp/target-drvs.txt)"
          comm -23 /tmp/target-drvs.txt /tmp/live-drvs.txt | sed -E 's#/nix/store/[a-z0-9]{32}-##' | head -60
          echo "===== count ====="
          comm -23 /tmp/target-drvs.txt /tmp/live-drvs.txt | wc -l
