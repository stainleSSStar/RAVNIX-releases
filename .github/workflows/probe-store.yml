name: Probe store format
on:
  workflow_dispatch:
  pull_request:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Reproduce the plan of the guest installation
        run: |
          set -e
          rm -rf /tmp/target
          mkdir -p /tmp/target
          cp -R ./. /tmp/target/etc-nixos/
          rm -rf /tmp/target/etc-nixos/.git
          cat > /tmp/target/etc-nixos/host.nix <<'HOST'
          { ... }: {
            networking.hostName = "ravnix-test";
            time.timeZone = "Europe/Warsaw";
            users.users."tester" = {
              isNormalUser = true;
              extraGroups = [ "wheel" "networkmanager" "video" "render" "input" "lp" "scanner" "dialout" ];
            };
            boot.loader.grub = {
              enable = true;
              device = "/dev/sda";
              efiSupport = false;
              efiInstallAsRemovable = false;
            };
            boot.loader.efi = { canTouchEfiVariables = false; efiSysMountPoint = "/boot/efi"; };
          }
          HOST
          cat > /tmp/target/etc-nixos/hardware-configuration.nix <<'HW'
          { ... }: {
            boot.initrd.availableKernelModules = [ "ahci" "ata_base" "ata_generic" "ata_piix" "libata" "sd_mod" "sr_mod" ];
            boot.initrd.kernelModules = [ ];
            boot.supportedFilesystems = [ "ext4" "vfat" ];
            fileSystems."/" = {
              device = "/dev/disk/by-label/RAVNIX_ROOT";
              fsType = "ext4";
            };
          }
          HW
          cat > /tmp/target/etc-nixos/configuration.nix <<'CFG'
          { ... }: { imports = [ ./modules/base.nix ./hardware-configuration.nix ./host.nix ]; }
          CFG
          target=$(nix eval --raw "path:/tmp/target/etc-nixos#nixosConfigurations.ravnix.config.system.build.toplevel.drvPath")
          echo "target toplevel: $target"
          live=$(nix eval --raw .#nixosConfigurations.live.config.system.build.toplevel.drvPath)
          echo "live toplevel: $live"
          nix-store --query --requisites "$target" | sort -u > /tmp/target-req.txt
          nix-store --query --requisites "$live" | sort -u > /tmp/live-req.txt
          echo "target requisites: $(wc -l < /tmp/target-req.txt)"
          echo "live requisites: $(wc -l < /tmp/live-req.txt)"
          echo "===== what the guest has to build that the live image does not carry ====="
          comm -23 /tmp/target-req.txt /tmp/live-req.txt > /tmp/guest-builds.txt
          echo "count: $(wc -l < /tmp/guest-builds.txt)"
          sed -E 's#/nix/store/[a-z0-9]{32}-##' /tmp/guest-builds.txt | grep -v '\.drv$' | head -40
          echo "===== sources those builds would download ====="
          while read -r drv; do
            nix derivation show "$drv" 2>/dev/null || true
          done < /tmp/guest-builds.txt | jq -r 'select(. != null) | .inputSources // [] | .[]' | sort -u > /tmp/guest-sources.txt
          echo "sources: $(wc -l < /tmp/guest-sources.txt)"
          comm -23 /tmp/guest-sources.txt /tmp/live-req.txt | sed -E 's#/nix/store/[a-z0-9]{32}-##' | head -30
          echo "===== is the kernel in the live image? ====="
          grep -E '\-linux-[0-9]' /tmp/live-req.txt | sed -E 's#/nix/store/[a-z0-9]{32}-##' | head -5
          echo "===== perl in the live image ====="
          grep -iE 'perl' /tmp/live-req.txt | sed -E 's#/nix/store/[a-z0-9]{32}-##' | head -10
          echo "===== grub in the live image ====="
          grep -iE 'grub' /tmp/live-req.txt | sed -E 's#/nix/store/[a-z0-9]{32}-##' | head -10
