name: Build RAVNIX ISO
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      build_iso:
        description: Build the desktop ISO and run BIOS/UEFI installation tests
        type: boolean
        default: true
      stage_release:
        description: Stage a private draft only after all ISO tests pass
        type: boolean
        default: true
defaults:
  run:
    shell: bash
permissions:
  contents: read
concurrency:
  group: ravnix-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = false
      - name: Source and installer guard tests
        run: |
          # azure.archive.ubuntu.com intermittently hangs from GH runners; pin the
          # primary mirror and retry transient connection failures.
          sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          APT_OPTS="-o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          sudo apt-get update $APT_OPTS
          sudo apt-get install -y $APT_OPTS shellcheck
          shellcheck -s bash scripts/install.sh
          python3 scripts/check.py
          python3 -m unittest discover -s tests -v
      - name: Evaluate pinned live, BIOS and UEFI systems
        run: |
          nix flake lock
          git add flake.lock
          echo RAVNIX_LOCK_BEGIN
          cat flake.lock
          echo RAVNIX_LOCK_END
          nix flake check --no-build --show-trace
  iso:
    needs: validate
    if: github.event_name == 'workflow_dispatch' && inputs.build_iso
    runs-on: ubuntu-24.04
    # The desktop closure has to be copied into the virtual machine and
    # rebuilt twice per firmware mode.
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = false
            max-jobs = 4
      - name: Free runner disk space
        run: |
          # The desktop closure and the ISO builder together need more room
          # than the runner has with its preinstalled toolchains in place.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /usr/local/share/boost /usr/share/swift \
            /usr/lib/jvm /usr/local/graalvm /usr/local/share/powershell \
            /usr/share/azure-cli /opt/hostedtoolcache/CodeQL \
            /usr/lib/llvm-14 /usr/lib/llvm-15 /usr/lib/llvm-16 /usr/lib/llvm-17
          sudo rm -rf /var/lib/apt/lists/*
          sudo apt-get clean
          df -h /
      - name: Build pinned desktop ISO
        run: |
          mkdir out
          # Fetch and build the whole closure first, then drop the downloaded
          # sources: the ISO builder needs the disk space more than the
          # compressed archives do.
          nix build .#nixosConfigurations.live.config.system.build.toplevel --no-link
          rm -rf "${XDG_CACHE_HOME:-$HOME/.cache}/nix/tarballs"
          df -h /
          nix build .#iso -L 2>&1 | tee out/build.log
          df -h /
          # A hard link avoids holding a second copy of the multi-gigabyte image.
          ln result/iso/*.iso out/ 2>/dev/null || cp result/iso/*.iso out/
          cp flake.lock out/flake.lock
          cp docs/GUIDE.md out/GUIDE.md
          nix path-info --recursive .#nixosConfigurations.live.config.system.build.toplevel > out/live-store-paths.txt
          nix path-info --closure-size .#nixosConfigurations.live.config.system.build.toplevel > out/closure-size.txt
          printf 'Source: %s\nNixpkgs: %s\n' "$GITHUB_SHA" "$(jq -r '.nodes.nixpkgs.locked.rev' flake.lock)" > out/build-info.txt
          # The desktop image is larger than the 2 GiB release-asset limit, so
          # the whole-image digest is kept apart from the per-part digests.
          (cd out && sha256sum *.iso > ISO-SHA256 && sha256sum -c ISO-SHA256)
          # The ISO does not reference the closure it contains, so the store can
          # be trimmed again to leave room for the virtual machine disks.
          nix store gc || true
          df -h /
      - name: Test BIOS live ISO, installation, login, rebuild and reboot
        run: |
          echo "runner cores: $(nproc), memory: $(free -g | awk '/^Mem:/{print $2}') GiB"
          ls -l /dev/kvm || echo "no /dev/kvm on this runner"
          sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          APT_OPTS="-o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          sudo apt-get update $APT_OPTS
          sudo apt-get install -y $APT_OPTS qemu-system-x86 ovmf
          python3 scripts/vm-test.py out/*.iso --mode bios 2>&1 | tee out/vm-bios-tests.log
      - name: Test UEFI live ISO, installation, login, rebuild and reboot
        run: |
          python3 scripts/vm-test.py out/*.iso --mode uefi 2>&1 | tee out/vm-uefi-tests.log
      - name: Record full firmware validation
        run: |
          printf '%s\n' 'PASS: BIOS and UEFI live, KDE Plasma desktop, text installation, password login, rebuild and reboot.' 'Physical hardware, Secure Boot, dual boot and encryption are not tested.' > out/VM-TESTS.txt
      - name: Split the image into release parts
        run: |
          set -euo pipefail
          shopt -s nullglob
          # GitHub rejects release assets of 2 GiB or more, and the desktop
          # image is about 3.7 GB, so the tested image is published in parts.
          isos=(out/*.iso)
          [[ ${#isos[@]} == 1 && -s ${isos[0]} ]]
          image=${isos[0]}
          name=$(basename "$image")
          split -b 1800M -d -a 2 -- "$image" "out/$name.part-"
          rm -f -- "$image"
          (cd out && sha256sum "$name".part-* > SHA256SUMS && sha256sum -c SHA256SUMS)
          {
            printf '%s\n' \
              'The RAVNIX desktop ISO is published in parts because GitHub limits a' \
              'single release asset to 2 GiB and the image is larger than that.' \
              '' \
              'Reassemble it:' \
              '' \
              "    cat $name.part-* > $name" \
              '' \
              'Verify the parts before reassembling:' \
              '' \
              '    sha256sum -c SHA256SUMS' \
              '' \
              'Verify the reassembled image afterwards:' \
              '' \
              "    sha256sum -c ISO-SHA256"
          } > out/PARTS.txt
          cat out/PARTS.txt
          ls -l out/
      - name: Keep the tested parts recoverable
        if: success()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ravnix-iso-parts
          path: |
            out/*.iso.part-*
            out/SHA256SUMS
            out/ISO-SHA256
            out/PARTS.txt
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
      - name: Stage complete tested release (private draft)
        if: success() && inputs.stage_release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(out/*.iso.part-*)
          [[ ${#parts[@]} -ge 1 ]]
          (cd out && sha256sum -c SHA256SUMS)
          grep -qx 'PASS: BIOS and UEFI live, KDE Plasma desktop, text installation, password login, rebuild and reboot.' out/VM-TESTS.txt
          tag="v26.05-r${GITHUB_RUN_NUMBER}"
          gh release create "$tag" --draft --latest=false --title "RAVNIX 26.05 Desktop (build ${GITHUB_RUN_NUMBER})" --notes "NixOS 26.05 derivative with KDE Plasma 6, the Purple Neon theme, a custom wallpaper and a branded GRUB bootloader. Fish shell, graphical networking, Brave Origin, Midnight Commander, btop and fastfetch are preinstalled. Both installers are included: the standard NixOS graphical installer (Calamares) and RAVNIX's own text installer. The image is published in parts because GitHub limits a release asset to 2 GiB; reassemble it with 'cat ravnix-26.05-x86_64.iso.part-* > ravnix-26.05-x86_64.iso' and verify it against ISO-SHA256. Source: ${GITHUB_SHA}. BIOS and UEFI live, actual installation, password-required sudo, rebuild and reboot tests passed. See GUIDE.md, PARTS.txt, SHA256SUMS and VM logs. Physical hardware and Secure Boot are not covered."
          for asset in out/*.iso.part-* out/SHA256SUMS out/ISO-SHA256 out/PARTS.txt out/VM-TESTS.txt out/build-info.txt out/flake.lock out/GUIDE.md out/closure-size.txt out/live-store-paths.txt out/vm-bios-tests.log out/vm-uefi-tests.log; do
            [[ -s $asset ]] || continue
            gh release upload "$tag" "$asset"
          done
          echo "Tested files staged as private draft $tag. Publish with scripts/publish-release.sh $tag."
