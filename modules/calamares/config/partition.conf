#
# The partitioning of the RAVNIX graphical installer.
#
# The stock configuration of the NixOS extensions mounts the EFI system
# partition at /boot and offers encryption, LVM and a choice of filesystems.
# RAVNIX prepares one layout instead, the same one the text installer creates
# and the same one the release is tested with:
#
# - The EFI system partition is mounted at /boot/efi, the place where the
#   RAVNIX configuration expects it.
# - The layout does not depend on the firmware: a GPT disk with an EFI system
#   partition, a small partition that holds the BIOS bootloader and the root
#   filesystem. GRUB needs the BIOS partition on a GPT disk, and the result
#   boots on a BIOS and on a UEFI machine.
# - The root filesystem is ext4, the filesystem the text installer uses and the
#   only one the bootloader is guaranteed to read.
# - There is no encryption, no LVM and no swap partition. The RAVNIX
#   configuration does not unlock an encrypted root, so an encrypted
#   installation would not boot.
efi:
    mountPoint: "/boot/efi"
    recommendedSize: 512MiB
    minimumSize: 32MiB
    label: "EFI"

createHybridBootloaderLayout: true

defaultFileSystemType: "ext4"

availableFileSystemTypes:
    - ext4

userSwapChoices:
    - none

enableLuksAutomatedPartitioning: false

lvm:
    enable: false

partitionLayout:
    - name: "root"
      filesystem: "unknown"
      noEncrypt: false
      mountPoint: "/"
      size: 100%
